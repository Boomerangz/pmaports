# Use case configuration for Sony Xperia XZ Premium (maple), WCD9335 over SLIMbus.

SectionVerb {
	EnableSequence [
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
		cset "name='SLIM RX2 MUX' ZERO"
		cset "name='SLIM RX3 MUX' ZERO"
		cset "name='SLIM RX4 MUX' ZERO"
		cset "name='SLIM RX7 MUX' ZERO"
		cset "name='SLIM RX5 MUX' AIF4_PB"
		cset "name='SLIM RX6 MUX' AIF4_PB"
		cset "name='RX5 Digital Volume' 68"
		cset "name='RX6 Digital Volume' 68"
		cset "name='SLIMBUS_6_RX Audio Mixer MultiMedia2' 1"
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"
		cset "name='SLIM TX0 MUX' DEC0"
		cset "name='ADC MUX0' DMIC"
		cset "name='DMIC MUX0' DMIC0"
		cset "name='DEC0 Volume' 104"
		cset "name='MultiMedia1 Mixer SLIMBUS_0_TX' 1"
	]

	DisableSequence [
		cset "name='SLIMBUS_6_RX Audio Mixer MultiMedia2' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	EnableSequence [
		# Both SLIM ports of the stereo stream must be consumed, or RX6
		# overflows and the earpiece only clicks and rasps.
		cset "name='RX INT0_1 MIX1 INP0' RX5"
		cset "name='RX INT0_1 MIX1 INP1' RX6"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX0 Digital Volume' 80"
		cset "name='EAR PA Volume' 4"
	]

	DisableSequence [
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='RX INT0_1 MIX1 INP1' ZERO"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	ConflictingDevice [
		"Earpiece"
		"Headphones"
	]

	EnableSequence [
		cset "name='RX INT7_1 MIX1 INP0' RX5"
		cset "name='RX INT8_1 MIX1 INP0' RX6"
		cset "name='COMP7 Switch' 1"
		cset "name='COMP8 Switch' 1"
		cset "name='RX7 Digital Volume' 80"
		cset "name='RX8 Digital Volume' 80"
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrRight COMP Switch' 1"
		cset "name='SpkrRight BOOST Switch' 1"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='SpkrLeft PA Volume' 10"
		cset "name='SpkrRight PA Volume' 10"
		cset "name='SpkrLeft DAC Switch' 1"
		cset "name='SpkrRight DAC Switch' 1"
	]

	DisableSequence [
		cset "name='SpkrLeft DAC Switch' 0"
		cset "name='SpkrRight DAC Switch' 0"
		cset "name='RX INT7_1 MIX1 INP0' ZERO"
		cset "name='RX INT8_1 MIX1 INP0' ZERO"
	]

	Value {
		PlaybackPriority 250
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Earpiece"
		"Speaker"
	]

	EnableSequence [
		cset "name='RX INT1_2 MUX' RX5"
		cset "name='RX INT2_2 MUX' RX6"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT2 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX HPH Mode' 'Class-H Hi-Fi'"
		cset "name='COMP1 Switch' 1"
		cset "name='COMP2 Switch' 1"
		cset "name='HPHL Volume' 20"
		cset "name='HPHR Volume' 20"
		cset "name='RX1 Mix Digital Volume' 84"
		cset "name='RX2 Mix Digital Volume' 84"
	]

	DisableSequence [
		cset "name='RX INT1_2 MUX' ZERO"
		cset "name='RX INT2_2 MUX' ZERO"
		cset "name='COMP1 Switch' 0"
		cset "name='COMP2 Switch' 0"
	]

	Value {
		PlaybackPriority 300
		JackControl "Headphone Jack"
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone"

	EnableSequence [
		cset "name='DMIC MUX0' DMIC0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
		CaptureRate 48000
	}
}
